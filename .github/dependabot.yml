# Dependency updates (https://docs.github.com/code-security/dependabot).
version: 2
updates:
  # the workflows pin actions to a commit; this keeps the pins moving, one pull request a week
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # npm: security updates only. Version updates are off (limit 0): the engine pins three.js, SES, PhysX glue and
  # Node itself, and upgrades are made deliberately with the e2e suites. Security updates still open pull
  # requests when "Dependabot security updates" is enabled in the repository settings.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
