name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'

# the job only reads the repository; third-party actions are pinned to a commit (the tag is in the comment)
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required gate: eslint (0 errors) and prettier --check. Neither rewrites a file; `npm run format` is the writer.
      # The lint script also caps warnings (--max-warnings in package.json): that number is what is left of
      # react-hooks/exhaustive-deps and of no-console in client code, and it may only go down.
      - name: Lint and format check
        run: npm run check

      # NOTE: client:build and viewer:build each empty build/ (what the first wrote does not survive the second);
      # node-client:build and the server build add to it. The server build runs last, as in the documented local
      # order: it is the one the tests and the e2e suites run.
      - name: Build (client)
        run: npm run client:build

      - name: Build (viewer)
        run: npm run viewer:build

      - name: Build (node-client)
        run: npm run node-client:build

      - name: Build (server)
        run: npm run build

      - name: Test
        run: npm test

      # LAST STEP OF THE JOB (new steps go above this one). The Docker image is built by hand, so this is the only
      # automatic check that the server starts without dev dependencies: scripts/prod-smoke.mjs copies build/ and
      # src/ to a temp folder, runs `npm ci --omit=dev` there, starts the server and asks for /health, / and /env.js.
      # It does not build or run the image (Alpine/musl, the image's own install and prune, its HEALTHCHECK command).
      - name: Production install smoke (server starts without dev dependencies)
        timeout-minutes: 10
        run: node scripts/prod-smoke.mjs
