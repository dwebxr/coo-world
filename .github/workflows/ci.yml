name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'

# the job only reads the repository; third-party actions are pinned to a commit (the tag is in the comment)
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required gate: eslint (0 errors) and prettier --check. Neither rewrites a file; `npm run format` is the writer.
      - name: Lint and format check
        run: npm run check

      # NOTE: client/viewer/node-client builds each empty build/, so run the
      # server build last to mirror the documented local build order.
      - name: Build (client)
        run: npm run client:build

      - name: Build (viewer)
        run: npm run viewer:build

      - name: Build (node-client)
        run: npm run node-client:build

      - name: Build (server)
        run: npm run build

      - name: Test
        run: npm test
