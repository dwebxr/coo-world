name: E2E

# Browser-driven checks of a built world (see test/e2e/README.md). Separate from ci.yml so lint, build
# and unit tests stay fast. No secrets: the job runs with dummy env values and an in-harness AI mock.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/e2e/**'
      # evm-tips-gate.mjs installs the NFT gate example as an app
      - 'docs/scripting/examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  # main itself is checked after every merge (a pull request can skip the suites through the paths filter), and
  # weekly so drift in browsers, runners or dependencies shows up without a change
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Chromium and WebKit decide the result. The Firefox leg is advisory: its suites run to the end, a failing
    # one does not fail the job, and the last step lists what failed as a warning on the run.
    name: e2e (${{ matrix.engine }}${{ matrix.engine == 'firefox' && ', advisory' || '' }})
    # a fixed image, not ubuntu-latest: the browsers Playwright installs are built per Ubuntu release, and the
    # pinned Playwright has none for a release newer than itself (the label moved to 26.04 and every leg failed
    # at "Install browser"). Move this together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # software-rendered Chromium runs the simulated-time suites far below real time (physics-boundary alone can take 20+ min)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps installs system packages with apt. The runner's package mirrors have been unreachable for hours
      # at a time (name resolution): apt then waits minutes per index before it gives up, two legs failed after ten
      # minutes without testing anything and one sat in this step until the job's 60 minutes were over. The step
      # has its own limit (an install takes under a minute); a run that fails here is run again by hand.
      - name: Install browser
        timeout-minutes: 5
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # client/viewer/node-client builds each empty build/, so the server build runs last
      - name: Build (client)
        env:
          PUBLIC_RPC_URL: https://sentinel.invalid/?api-key=E2E_SENTINEL
        run: npm run client:build

      - name: Build (viewer)
        env:
          PUBLIC_RPC_URL: https://sentinel.invalid/?api-key=E2E_SENTINEL
        run: npm run viewer:build

      - name: Build (node-client)
        env:
          PUBLIC_RPC_URL: https://sentinel.invalid/?api-key=E2E_SENTINEL
        run: npm run node-client:build

      - name: Build (server)
        env:
          PUBLIC_RPC_URL: https://sentinel.invalid/?api-key=E2E_SENTINEL
        run: npm run build

      - name: WebSocket frames (${{ matrix.engine }})
        id: ws_frames
        run: node test/e2e/ws-frames.mjs --engine=${{ matrix.engine }}

      # Firefox has no WebGL on this runner. The raw frame probe above is still required for every engine.
      - name: Full-stack
        id: fullstack
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/fullstack.mjs --engine=${{ matrix.engine }}

      - name: Hostile player transforms (local throwaway world)
        id: hostile_transforms
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/hostile-transforms.mjs --engine=${{ matrix.engine }}

      - name: Hostile content (node values that become sizes, cursors, failed loads)
        id: hostile_content
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/hostile-content.mjs --engine=${{ matrix.engine }}

      - name: Physics boundary and native sentinel (local throwaway world)
        id: physics_boundary
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/physics-boundary.mjs --engine=${{ matrix.engine }}

      - name: Phone model images (iPhone / iPad user agents)
        id: phone_images
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/phone-images.mjs --engine=${{ matrix.engine }}

      - name: Extras (movement, avatar, uploads, AI mock, agent)
        id: gate_extras
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/gate-extras.mjs --engine=${{ matrix.engine }}

      - name: Token gate
        id: token_gate
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/token-gate.mjs --engine=${{ matrix.engine }}

      - name: EVM wallet (SIWE)
        id: evm_wallet
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/evm-wallet.mjs --engine=${{ matrix.engine }}

      - name: EVM tips and NFT gate (mock RPC)
        id: evm_tips_gate
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/evm-tips-gate.mjs --engine=${{ matrix.engine }}

      # a smoke only on shared runners (failures and errors, not throughput): 200 frames fit a slow
      # software-rendered run; the performance budgets (600 frames) are enforced on a designated machine
      - name: Stress (smoke)
        id: stress
        continue-on-error: ${{ matrix.engine == 'firefox' }}
        run: node test/e2e/stress.mjs --engine=${{ matrix.engine }} --frames=200

      - name: Advisory failures (Firefox)
        id: advisory
        if: ${{ always() && matrix.engine == 'firefox' }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          failed=$(node -e 'const steps = JSON.parse(process.env.OUTCOMES); console.log(Object.keys(steps).filter(id => steps[id].outcome === "failure").join(", "))')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::warning title=Firefox (advisory)::failed suites: $failed"
          else
            echo "no advisory failures"
          fi

      # failure() is false when only tolerated Firefox suites failed, so that case is named as well
      - name: Upload logs and screenshots
        if: ${{ failure() || steps.advisory.outputs.failed != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.engine }}
          path: test/e2e/out/
          if-no-files-found: ignore

  # One check that says whether the suites passed: green only when every engine's job succeeded (for Firefox that
  # means it installed, built and ran; see the advisory note above), so a cancelled or timed-out leg fails it.
  # needs.e2e.result folds the matrix into one word, and GitHub has reported success there for a leg cancelled
  # before it got a runner and after a partial re-run. So the job also asks for each engine's own job: its latest
  # execution across attempts must have succeeded.
  result:
    name: e2e
    if: ${{ always() }}
    needs: e2e
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Result of the suites
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "matrix result: $RESULT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // "none")] | @tsv' > jobs.tsv
          cat jobs.tsv
          status=0
          for name in 'e2e (chromium)' 'e2e (webkit)' 'e2e (firefox, advisory)'; do
            conclusions=$(awk -F'\t' -v name="$name" '$1 == name { print $2 }' jobs.tsv | sort -u | tr '\n' ' ')
            if [ "$conclusions" != "success " ]; then
              echo "::error::$name: ${conclusions:-no job found}"
              status=1
            fi
          done
          [ "$RESULT" = "success" ] || status=1
          exit $status
