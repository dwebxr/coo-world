name: Image

# Builds the Docker image from the Dockerfile and runs it (scripts/image-check.mjs): the container has to become
# healthy, and a `docker stop` (SIGTERM, 10 s) and a `docker stop --signal SIGINT -t 5` (Fly's documented default
# signal and timeout) each have to end it with exit code 0 after the server's final save. Who PID 1 is, the process
# tree and the uids are recorded in the job's output and in the uploaded summary. Nothing is pushed anywhere, the
# containers publish no port, and every setting is made up: there are no secrets here.
#
# NOT A REQUIRED CHECK, and it must not be made one: with a `paths` filter the workflow does not run for a pull
# request that touches none of these files, and a required check that never reports stays pending for good.
#
# It runs when what the image is built from changes, or the server's start-up and stop (src/server/, and src/core/,
# which is bundled into the server: the final save is ServerNetwork.flushBeforeExit), or the check itself; on main
# after such a merge; weekly, because the base image's tag (FROM node:…-alpine) can be pushed again with other
# contents and the `apk` packages are whatever the day's index holds; and by hand.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/build*.mjs'
      - 'scripts/lib/**'
      - 'scripts/image-check.mjs'
      - 'src/server/**'
      - 'src/core/**'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/build*.mjs'
      - 'scripts/lib/**'
      - 'scripts/image-check.mjs'
      - 'src/server/**'
      - 'src/core/**'
      - '.github/workflows/image.yml'
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

# the job only reads the repository; third-party actions are pinned to a commit (the tag is in the comment)
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      # Node only runs the script. There is no `npm ci` on purpose: scripts/image-check.mjs and the two modules it
      # imports use Node's own modules and nothing from node_modules (test/imageCheck.test.js holds them to that),
      # and the image installs its own dependencies inside `docker build`. So no npm cache either.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      # The runner's own Docker and plain `docker build`: no Docker action, no registry login, no push. The script
      # removes the containers, the volume and the tag it made, also when a step fails.
      # `exec`: when the run is cancelled, the runner signals the step's entry process (SIGINT, SIGTERM 7.5 s later,
      # the process tree killed 2.5 s after that). Without `exec` that process is Bash, which waits for Node and does
      # not pass the signal on, so the script would not learn of the cancel and its cleanup would be killed with it.
      # With `exec`, Node is the step's process and the script's own SIGINT/SIGTERM handling runs (image-check.mjs).
      - name: Build the image, run it and stop it
        run: exec node scripts/image-check.mjs --model=current --summary image-check.json --logs image-check-logs

      # also after a failure: the summary says what was seen up to there, the logs are the containers' whole output
      - name: Upload the summary and the container logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-check
          path: |
            image-check.json
            image-check-logs/
          if-no-files-found: warn
